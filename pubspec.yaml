name: gym_tracker_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  sqflite: ^2.4.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:

  uses-material-design: true

  fonts:
    - family: MatchaMint
      fonts:
        - asset: lib/assets/fonts/MatchaMint.ttf
    - family: Marola
      fonts:
        - asset: lib/assets/fonts/Marola.ttf
