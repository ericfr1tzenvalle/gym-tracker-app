name: gym_tracker_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: MatchaMint
      fonts:
        - asset: lib/assets/fonts/MatchaMint.ttf
    - family: Marola
      fonts:
        - asset: lib/assets/fonts/Marola.ttf
